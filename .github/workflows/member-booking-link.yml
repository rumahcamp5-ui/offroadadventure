name: Offroad member booking link
on:
  pull_request:
  push:
    branches: ['feature/member-booking-link-*']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --test whatsapp.test.cjs member-booking-link.test.cjs
