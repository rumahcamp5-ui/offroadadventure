name: International WhatsApp booking checks
on:
  pull_request:
  push:
    branches: [fix/international-whatsapp-20261114]
permissions:
  contents: read
jobs:
  phone-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --test whatsapp.test.cjs
